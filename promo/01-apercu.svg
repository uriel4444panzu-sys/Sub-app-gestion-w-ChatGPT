<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="940" cy="240" r="320" fill="#14b8a6" opacity="0.18"/>
  <circle cx="120" cy="1600" r="280" fill="#ec4899" opacity="0.12"/>

  <!-- Brand -->
  <g transform="translate(90,120)">
    <rect width="92" height="92" rx="26" fill="url(#mark)"/>
    <text x="46" y="64" font-size="54" fill="#fff" text-anchor="middle">✦</text>
    <text x="120" y="62" font-size="46" font-weight="800" fill="#fff" letter-spacing="-1">SubPilot</text>
  </g>

  <!-- Headline -->
  <g transform="translate(90,360)" fill="#fff">
    <text font-size="92" font-weight="900" letter-spacing="-3">
      <tspan x="0" y="0">Tous vos abonnements,</tspan>
      <tspan x="0" y="108">enfin sous contrôle.</tspan>
    </text>
    <text x="0" y="220" font-size="40" fill="#cbd5e1" font-weight="500">Suivez vos dépenses récurrentes d'un coup d'œil.</text>
  </g>

  <!-- Phone -->
  <g transform="translate(230,720)" filter="url(#shadow)">
    <rect width="620" height="1120" rx="64" fill="#0f172a"/>
    <rect x="18" y="18" width="584" height="1084" rx="50" fill="#f1f5ff"/>
    <rect x="250" y="40" width="120" height="22" rx="11" fill="#0f172a"/>

    <!-- hero metric card -->
    <g transform="translate(54,110)">
      <rect width="512" height="250" rx="34" fill="#0f172a"/>
      <text x="36" y="74" font-size="24" fill="#a5b4fc" font-weight="800" letter-spacing="2">TOTAL MENSUEL</text>
      <text x="36" y="170" font-size="92" fill="#fff" font-weight="900" letter-spacing="-3">79,46 €</text>
      <text x="36" y="216" font-size="26" fill="#94a3b8">8 abonnements actifs</text>
    </g>

    <!-- list -->
    <g transform="translate(54,400)">
      <text x="0" y="0" font-size="26" font-weight="800" fill="#0f172a">Renouvellements à venir</text>

      <g transform="translate(0,30)">
        <rect width="512" height="120" rx="28" fill="#ffffff"/>
        <rect x="28" y="30" width="60" height="60" rx="18" fill="#7c3aed"/>
        <text x="58" y="70" font-size="24" fill="#fff" font-weight="800" text-anchor="middle">NF</text>
        <text x="110" y="58" font-size="30" font-weight="800" fill="#0f172a">Netflix</text>
        <text x="110" y="92" font-size="24" fill="#64748b">dans 3 jours</text>
        <rect x="362" y="38" width="124" height="44" rx="22" fill="#eef2ff"/>
        <text x="424" y="67" font-size="24" font-weight="800" fill="#4f46e5" text-anchor="middle">13,49 €</text>
      </g>

      <g transform="translate(0,170)">
        <rect width="512" height="120" rx="28" fill="#ffffff"/>
        <rect x="28" y="30" width="60" height="60" rx="18" fill="#ec4899"/>
        <text x="58" y="70" font-size="24" fill="#fff" font-weight="800" text-anchor="middle">SP</text>
        <text x="110" y="58" font-size="30" font-weight="800" fill="#0f172a">Spotify</text>
        <text x="110" y="92" font-size="24" fill="#64748b">dans 9 jours</text>
        <rect x="362" y="38" width="124" height="44" rx="22" fill="#eef2ff"/>
        <text x="424" y="67" font-size="24" font-weight="800" fill="#4f46e5" text-anchor="middle">10,99 €</text>
      </g>

      <g transform="translate(0,310)">
        <rect width="512" height="120" rx="28" fill="#ffffff"/>
        <rect x="28" y="30" width="60" height="60" rx="18" fill="#2563eb"/>
        <text x="58" y="70" font-size="22" fill="#fff" font-weight="800" text-anchor="middle">AD</text>
        <text x="110" y="58" font-size="30" font-weight="800" fill="#0f172a">Adobe</text>
        <text x="110" y="92" font-size="24" fill="#64748b">dans 21 jours</text>
        <rect x="350" y="38" width="136" height="44" rx="22" fill="#eef2ff"/>
        <text x="418" y="67" font-size="24" font-weight="800" fill="#4f46e5" text-anchor="middle">19,99 €</text>
      </g>
    </g>
  </g>
</svg>
