<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Logo SubPilot">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Full-bleed background (recadrage circulaire OK) -->
  <rect width="1024" height="1024" fill="url(#g)"/>
  <circle cx="512" cy="430" r="430" fill="url(#glow)"/>

  <!-- Marque ✦ (étoile 4 branches), vectorielle -->
  <path d="M512 132 L597 427 L892 512 L597 597 L512 892 L427 597 L132 512 L427 427 Z"
        fill="#ffffff" filter="url(#s)"/>
</svg>
